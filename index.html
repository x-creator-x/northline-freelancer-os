<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="NORTHLINE Freelancer OS — إدارة العملاء والمشاريع والأرباح في مكان واحد"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>NORTHLINE — Freelancer OS</title>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">N<span>.</span></div><div><b>NORTHLINE</b><small>FREELANCER OS</small></div></div>
 <div class="workspace-label">WORKSPACE</div>
 <nav id="sideNav">
  <button class="nav-item active" data-page="dashboard"><i>▦</i><span>لوحة التحكم</span></button>
  <button class="nav-item" data-page="clients"><i>♙</i><span>العملاء</span><em id="clientCount">0</em></button>
  <button class="nav-item" data-page="projects"><i>▤</i><span>المشاريع</span><em id="projectCount">0</em></button>
  <button class="nav-item" data-page="payments"><i>↗</i><span>الدفعات</span></button>
  <button class="nav-item" data-page="expenses"><i>⌁</i><span>المصروفات</span></button>
  <button class="nav-item" data-page="time"><i>◷</i><span>ساعات العمل</span></button>
  <div class="nav-separator"></div>
  <button class="nav-item" data-page="pricing"><i>⌗</i><span>حاسبة التسعير</span></button>
  <button class="nav-item" data-page="messages"><i>✉</i><span>مولد الرسائل</span></button>
  <button class="nav-item" data-page="settings"><i>⚙</i><span>الإعدادات</span></button>
 </nav>
 <div class="sidebar-bottom"><div class="profile"><div class="avatar">N</div><div><b id="profileName">NORTHLINE</b><small>Freelancer workspace</small></div><button id="themeBtn" title="تبديل المظهر">◐</button></div><div class="version">NORTHLINE OS <span>v1.0</span></div></div>
</aside>
<main class="main-area">
 <header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="crumb"><span>Workspace</span><b>/</b><strong id="pageTitle">لوحة التحكم</strong></div><div class="top-actions"><span class="live-dot"></span><span class="today" id="todayLabel"></span><button class="icon-btn" id="exportBtn" title="تصدير نسخة احتياطية">⇩</button><button class="primary-btn small" id="quickAdd">＋ <span>إضافة جديدة</span></button></div></header>
 <div id="content" class="content"></div>
 <footer class="footer">NORTHLINE <span>•</span> Built for independent work</footer>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal"><div class="modal-head"><div><small>NEW ENTRY</small><h2 id="modalTitle">إضافة عنصر</h2></div><button class="close-btn" id="closeModal">×</button></div><form id="entryForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="secondary-btn" id="cancelModal">إلغاء</button><button class="primary-btn" type="submit">حفظ البيانات</button></div></form></section></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
